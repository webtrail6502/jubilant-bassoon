<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta content='width=device-width, initial-scale=1.0' name='viewport'>
<meta content='#06131f' name='theme-color'>
<title>Statement - My Statement</title>
<link href='https://cdn.jsdelivr.net' rel='preconnect' crossorigin>
<link href='https://zqaequyzdrngxnifdkty.supabase.co' rel='preconnect' crossorigin>
<link href='https://fonts.googleapis.com' rel='preconnect'>
<link crossorigin='anonymous' href='https://fonts.gstatic.com' rel='preconnect'>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&amp;display=swap' rel='stylesheet' media='print' onload=\"this.media='all'\">
<link rel='stylesheet' href='css/style.css'>
</head>
<body data-page='statement'>

<!-- SPLASH -->
<div class='aurora' id='splash'><div class='orbs'><i></i><i></i><i></i><i></i></div><div id='logoBox'></div></div>

<!-- IMAGE VIEWER -->
<div id='lightbox'><img alt='' id='lightboxImg'></div>

<!-- APP -->
<div class='hidden' id='appScreen'>
<header>
  <div class='header-inner'>
    <div class='brand'><img alt='' class='brand-logo' id='headerLogo'><div><h1 id='brandTitle'>My Statement</h1><p>Daily collection &amp; payment tracker</p></div></div>
    <div class='branch-chip hidden' id='branchChip'><span class='rl' id='roleLbl' role='link' tabindex='0' title='See everyone in this branch'></span><span id='branchLbl'></span></div>
    <div class='user'>
      <img alt='' id='userPhoto'>
      <div class='uname'><strong id='userName'></strong><br><span id='userEmail'></span></div>
      <button id='pwBtn' class='hidden'>Change password</button>
      <button id='logoutBtn'>Logout</button>
    </div>
  </div>
</header>

<main>
<div class='denom-banner collapsed' id='denomBanner'><div class='db-in' id='denomBannerIn'><span class='db-ic'>&#10003;</span><span id='denomBannerText'>Denomination received</span><span class='db-n' id='denomBannerNum'>0</span></div></div>

<div class='tabs hidden' id='tabsBar'></div>

<div data-only='admin'>
<section class='card'>
  <h2>Statement</h2>
  <div class='filters'>
    <div>
      <label for='filterPerson'>Filter by Person</label>
      <select id='filterPerson'><option value='ALL'>All People</option><option value='Owner'>Owner</option></select>
    </div>
    <div><label for='filterDate'>Date</label><input id='filterDate' type='date'></div>
    <button class='secondary' id='showAllBtn'>Show All Dates</button>
  </div>
  <div id='statementContainer' style='margin-top:18px'></div>
</section>


</div>
<section class='card' id='histCard' data-only='delivery'>
  <h2 id='histTitle'>My Statement</h2>
  <div class='filters' style='grid-template-columns:1fr auto'>
    <div><label for='hFilterDate'>Date</label><input id='hFilterDate' type='date'></div>
    <button class='secondary' id='hShowAll'>Show All Dates</button>
  </div>
  <div id='histContainer' style='margin-top:18px'></div>
</section>
</main>
</div>

<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<script src='js/common.js'></script>
<script src='js/dashboard.js'></script>
</body>
</html>
